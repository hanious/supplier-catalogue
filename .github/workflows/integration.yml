name: Integration

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          mkdir gitleaks
          cd gitleaks
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Scan history and verify safety hooks
        run: |
          gitleaks git --redact --no-banner
          node --test scripts/hooks.test.mjs
      - name: Check Go and JavaScript
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          node --check web/app.js

  containers:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Build and start the application
        run: docker compose up --build --detach --wait
      - name: Run Go race and DynamoDB integration tests
        run: docker compose --profile tools run --build --rm test
      - name: Verify container HTTP flows and the full import
        run: node --test scripts/smoke.test.mjs
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop disposable CI services
        if: always()
        run: docker compose down --volumes
